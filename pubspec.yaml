name: evex_user
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.7
  dio: ^5.8.0+1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  # pretty_dio_logger: ^1.4.0
  alice: ^1.0.0
  alice_dio: ^1.0.7
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  pattern_formatter: ^4.0.0
  animate_do: ^4.2.0
  dropdown_search: ^6.0.2
  pin_code_fields: ^8.0.1
  expandable: ^5.0.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  # flutter_intl_phone_field: ^0.0.7
  flutter_intl_phone_field:
    path: packages/flutter_intl_phone_field-main
  flutter_localizations:
    sdk: flutter
  dropdown_button2: ^2.3.9
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  zoom_tap_animation: ^1.1.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^11.1.0
  app_links: ^6.3.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  webview_flutter: ^4.10.0
  # Social sign-in. Google + Apple are enabled; Facebook stays disabled.
  google_sign_in: ^6.2.1
#  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.4
  upgrader: ^11.3.1





dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.4.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appstore.png"

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15


#use dart run build_runner build --delete-conflicting-outputs

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/



  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
            
  #   - family: Almarai
  #     fonts:
  #       - asset: assets/fonts/Almarai-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Almarai-Bold.ttf
  #         weight: 700

# flutter_assets:
#   assets_path: assets/
#   output_path: lib/core/constants/
#   filename: app_assets.dart
#   classname: AppAssets

flutter_assets:
  assets_path:
    - assets/images/
    - assets/icons/
  output_path: lib/core/constants/
  filename: app_images.dart
  classname: AppImages
  field_prefix:
